<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Aerowing Airlines</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<nav>
    <div class="brand">
        <svg viewBox="0 0 24 24"><path d="M22 16v-2l-8.5-5V3.5c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5V9L2 14v2l8.5-2.5V19L8 20.5V22l4-1 4 1v-1.5L13.5 19v-5.5L22 16z"/></svg>
        Aerowing Airlines
    </div>
    <div class="nav-right">
        <a href="flights.html" class="nav-link">Flights</a>
        <a href="crew.html" class="nav-link admin-only-nav">Crew</a>
        <a href="bookings.html" class="nav-link">My Bookings</a>
        <a href="reports.html" class="nav-link admin-only-nav">Reports</a>
        <button class="logout-btn" onclick="logout()">Log Out</button>
    </div>
</nav>

<div class="content">
    <div class="welcome-card">
        <div class="eyebrow">Signed in as</div>
        <h2 id="welcomeEmail"></h2>
    </div>

    <div class="welcome-card" id="loyaltyCard">
        <div class="eyebrow">Loyalty Status</div>
        <h2>Loading...</h2>
    </div>

    <div class="panel" id="travellersPanel">
        <h3>Registered Travellers</h3>
        <p class="desc">Admin view — live data pulled from the protected <code>/api/users</code> endpoint.</p>
        <div id="status">Loading users...</div>
        <table id="userTable" style="display:none;">
            <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
                <th>Role</th>
                <th>Tier</th>
                <th>Miles</th>
            </tr>
            </thead>
            <tbody id="userTableBody"></tbody>
        </table>
    </div>
</div>

<script src="js/auth.js"></script>
<script src="js/dashboard.js"></script>
<script src="js/assistant-widget.js"></script>

</body>
</html>
